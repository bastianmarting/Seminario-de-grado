name: Quarto Publish

on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Cache TinyTeX
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ runner.os }}-v1

      - name: Install TeX dependencies
        run: |
          export PATH="$HOME/.TinyTeX/bin/$(uname -m)-linux:$PATH"
          tlmgr update --self
          tlmgr install tex-gyre babel-spanish hyphen-spanish
          tlmgr path add

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown

      - name: Render
        run: quarto render

      - name: Check gh-pages branch
        id: ghpages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize gh-pages branch
        if: steps.ghpages.outputs.exists == 'false'
        id: initghpages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EMPTY_TREE=$(git hash-object -t tree /dev/null)
          EMPTY_COMMIT=$(git commit-tree "$EMPTY_TREE" -m "Initialize gh-pages branch")
          git push origin "$EMPTY_COMMIT:refs/heads/gh-pages"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Pages
        if: steps.ghpages.outputs.exists == 'true' || steps.initghpages.outputs.created == 'true'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}